<svg viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VictoryRevConnect Boaters">
  <!-- Anchor icon mark -->
  <g transform="translate(8, 10)">
    <!-- Anchor ring at top -->
    <circle cx="24" cy="10" r="5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Anchor vertical shaft -->
    <line x1="24" y1="15" x2="24" y2="52" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Anchor crossbar -->
    <line x1="10" y1="24" x2="38" y2="24" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Anchor flukes (left) -->
    <path d="M24 52 Q12 48 10 42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Anchor flukes (right) -->
    <path d="M24 52 Q36 48 38 42" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Red chain loops (left) -->
    <path d="M10 42 Q6 40 8 36 Q10 32 14 34" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round"/>
    <!-- Red chain loops (right) -->
    <path d="M38 42 Q42 40 40 36 Q38 32 34 34" fill="none" stroke="#C8102E" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Wordmark text -->
  <!-- "VictoryRev" white, "Connect" red — one unbroken compound line -->
  <text y="44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="-0.5">
    <tspan x="70" fill="#ffffff">VictoryRev</tspan><tspan fill="#C8102E">Connect</tspan>
  </text>

  <!-- "BOATERS" subtext — navy, letter-spaced, uppercase -->
  <text x="70" y="64" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="400" font-size="13" letter-spacing="4" fill="#0A2240" text-anchor="start">BOATERS</text>
</svg>
