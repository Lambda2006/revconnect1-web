<svg viewBox="0 0 280 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VictoryRevConnect">
  <!-- Anchor icon mark -->
  <g transform="translate(8, 6)">
    <!-- Anchor ring at top -->
    <circle cx="18" cy="7" r="4" fill="none" stroke="#0A2240" stroke-width="2"/>
    <!-- Anchor vertical shaft -->
    <line x1="18" y1="11" x2="18" y2="38" stroke="#0A2240" stroke-width="2" stroke-linecap="round"/>
    <!-- Anchor crossbar -->
    <line x1="7" y1="18" x2="29" y2="18" stroke="#0A2240" stroke-width="2" stroke-linecap="round"/>
    <!-- Anchor flukes (left) -->
    <path d="M18 38 Q9 35 8 30" fill="none" stroke="#0A2240" stroke-width="2" stroke-linecap="round"/>
    <!-- Anchor flukes (right) -->
    <path d="M18 38 Q27 35 28 30" fill="none" stroke="#0A2240" stroke-width="2" stroke-linecap="round"/>
    <!-- Red chain loops (left) -->
    <path d="M8 30 Q5 28 6 25 Q8 22 11 24" fill="none" stroke="#C8102E" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Red chain loops (right) -->
